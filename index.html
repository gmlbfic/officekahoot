<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Y vos qué personaje de The Office serías? (en vivo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#DCE3E8; --sheet:#F7F9FA; --ink:#1C2B4A; --ink-soft:#4A5872;
  --rule:#9FB0C2; --stamp:#C8312B; --postit:#FFE45C; --folder:#E2B95B;
  --shadow:0 1px 0 #9FB0C2, 0 6px 0 -3px #C5D0DA;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --type:"Courier Prime", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141B26; --sheet:#1E2735; --ink:#E6ECF2; --ink-soft:#A7B3C2;
    --rule:#3A4859; --stamp:#F0564E; --postit:#E8CF45; --folder:#C9A04A;
    --shadow:0 1px 0 #3A4859, 0 6px 0 -3px #0E141C;
  }
}
:root[data-theme="dark"]{
  --paper:#141B26; --sheet:#1E2735; --ink:#E6ECF2; --ink-soft:#A7B3C2;
  --rule:#3A4859; --stamp:#F0564E; --postit:#E8CF45; --folder:#C9A04A;
  --shadow:0 1px 0 #3A4859, 0 6px 0 -3px #0E141C;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--type);font-size:17px;line-height:1.55;
  background-image:repeating-linear-gradient(0deg,transparent 0 31px,color-mix(in srgb,var(--rule) 25%,transparent) 31px 32px)}
main{max-width:720px;margin:0 auto;padding:24px 16px 64px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--stamp);outline-offset:3px}

/* Intro */
.intro{padding:40px 0 8px}
.intro h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,9vw,4.2rem);line-height:.95;letter-spacing:-.02em;margin:0 0 20px;max-width:12ch}
.intro p{max-width:46ch;margin:0 0 28px;color:var(--ink-soft)}
.memo{background:var(--postit);color:#1C2B4A;padding:18px 20px;transform:rotate(-1.5deg);max-width:340px;box-shadow:2px 3px 0 rgba(0,0,0,.12);margin:0 0 36px}
.memo b{font-family:var(--display);font-weight:800}
.btn{display:inline-block;border:2px solid var(--ink);background:var(--ink);color:var(--sheet);padding:14px 22px;font-family:var(--display);font-weight:800;font-size:1.05rem;cursor:pointer;border-radius:2px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover{transform:translateY(-1px)}

/* Question */
.sheet{background:var(--sheet);box-shadow:var(--shadow);border-radius:3px;position:relative}
.tab{position:relative;display:inline-block;background:var(--folder);color:#1C2B4A;padding:6px 16px 4px;border-radius:6px 6px 0 0;font-weight:700;font-size:.9rem}
.qhead{padding:22px 20px 18px;border-bottom:2px dashed var(--rule)}
.qhead h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.05;letter-spacing:-.015em;margin:0}
.progress{height:6px;background:color-mix(in srgb,var(--rule) 40%,transparent);margin:0 20px}
.progress span{display:block;height:100%;background:var(--stamp);transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:18px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.opt{display:flex;flex-direction:column;text-align:left;background:transparent;border:2px solid var(--rule);padding:0;cursor:pointer;border-radius:3px;overflow:hidden;position:relative}
.opt:hover{border-color:var(--ink)}
.pic{aspect-ratio:1/1;display:grid;place-items:center;font-size:3rem;background:var(--c,#ccd);position:relative}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.cap{padding:9px 10px 11px;font-size:.88rem;line-height:1.3;flex:1}
.opt[aria-pressed="true"]{border-color:var(--stamp)}
.opt[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:8px;width:34px;height:34px;display:grid;place-items:center;border:3px solid var(--stamp);color:var(--stamp);background:var(--sheet);border-radius:50%;font-family:var(--display);font-weight:800;transform:rotate(-10deg)}
.nav{display:flex;justify-content:space-between;padding:0 18px 18px}
.link{background:none;border:none;color:var(--ink-soft);cursor:pointer;text-decoration:underline;padding:6px 0}
.link[disabled]{visibility:hidden}

/* Result */
.file{padding:26px 22px 28px;position:relative;overflow:hidden}
.field{color:var(--ink-soft);font-size:.9rem;margin:0}
.name{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,11vw,4.8rem);line-height:.92;letter-spacing:-.025em;margin:6px 0 18px;color:var(--rc)}
.stamp{position:absolute;top:22px;right:-6px;transform:rotate(12deg);border:4px solid var(--stamp);color:var(--stamp);font-family:var(--display);font-weight:800;padding:4px 12px;font-size:1.1rem;letter-spacing:.06em;opacity:.85;animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(12deg) scale(2.2);opacity:0}to{transform:rotate(12deg) scale(1);opacity:.85}}
.emblem{font-size:3.2rem;line-height:1;margin-bottom:8px}
.bio{max-width:58ch;margin:0 0 26px;font-size:1.02rem}
.compat h3{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:0 0 10px}
.bar{display:grid;grid-template-columns:7.5rem 1fr 3rem;align-items:center;gap:10px;margin:0 0 8px;font-size:.92rem}
.bar i{height:12px;background:color-mix(in srgb,var(--rule) 40%,transparent);display:block;border-radius:2px;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--bc)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.toast{min-height:1.5em;color:var(--ink-soft);font-size:.9rem;margin-top:10px}
footer{color:var(--ink-soft);font-size:.8rem;margin-top:28px;max-width:60ch}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Pantalla de espera y avisos */
.wait{padding:34px 22px;text-align:left}
.wait h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.05;margin:0 0 12px}
.wait p{margin:0;color:var(--ink-soft);max-width:44ch}
.chosen{margin-top:18px;display:flex;gap:12px;align-items:center}
.chosen img{width:72px;height:72px;object-fit:cover;border-radius:3px;border:2px solid var(--stamp)}
.banner{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:.9rem;z-index:5}
.banner button{background:var(--postit);color:#1C2B4A;border:none;padding:8px 12px;font-family:var(--display);font-weight:800;cursor:pointer;border-radius:2px}
/* Modo presentador */
body.pres main{max-width:1280px;padding:12px 20px 16px}
.pres-top{margin:0 0 8px}
.pres .nav{padding:0 14px 14px}
.pres-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin:8px 0 14px}
.pres h1.big{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,6vw,5.4rem);line-height:.95;letter-spacing:-.02em;margin:0}
.pres .qtext{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,3.8vw,3.4rem);line-height:1;letter-spacing:-.015em;margin:0}
.pres .grid{grid-template-columns:repeat(6,1fr);gap:16px}
@media (max-width:900px){.pres .grid{grid-template-columns:repeat(3,1fr)}}
.pres .opt{cursor:default}
.pres .pic{aspect-ratio:1/1}
.pres .qhead{padding:16px 20px 12px}
.pres .grid{padding:14px;gap:12px}
.pres .cap{padding:6px 10px 8px}
.pres .cap{font-size:clamp(.85rem,1.2vw,1.05rem)}
.count{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,2.6vw,2.2rem)}
.controls{display:flex;gap:12px;flex-wrap:wrap}
.lobby{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;padding:32px}
@media (max-width:800px){.lobby{grid-template-columns:1fr}}
.qr{background:#fff;padding:14px;border-radius:4px;display:inline-block}
.url{font-size:1.2rem;word-break:break-all;margin:16px 0 0}
.tally{padding:28px}
.tally .bar{grid-template-columns:12rem 1fr 3.5rem;font-size:1.15rem;margin-bottom:12px}
.tally .bar i{height:22px}
.err{padding:28px}
/* Perfil del participante */
.profile{padding:22px;display:grid;gap:14px;max-width:420px}
.profile label{font-family:var(--display);font-weight:800;font-size:1.3rem}
.profile input{font:inherit;font-size:1.1rem;padding:12px;border:2px solid var(--ink);border-radius:2px;background:var(--sheet);color:var(--ink)}
.iconrow{display:flex;align-items:center;gap:16px}
.bigicon{font-size:3.4rem;line-height:1}
/* Participantes en el presentador */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.chip{border:2px solid var(--rule);background:var(--sheet);padding:4px 12px;border-radius:999px;font-size:1.05rem}
.faces{display:flex;flex-wrap:wrap;gap:6px;font-size:1.7rem;flex:1;justify-content:center}
.faces span{opacity:.22;transition:opacity .25s}
.faces span.on{opacity:1}
.trow{margin-bottom:6px}
.trow .chips{margin:0 0 12px}
/* Cierre grupal */
.diag{margin:6px 0 16px}
.diagtext{font-size:clamp(1.1rem,1.8vw,1.5rem);max-width:52ch;margin:0 0 14px}
.twist{font-size:clamp(1rem,1.5vw,1.25rem);color:var(--ink-soft);margin:0}
.reveal{display:grid;gap:10px}
.rrow{display:grid;grid-template-columns:2.4rem 14rem 3rem 1fr;align-items:center;gap:12px;transition:opacity .5s, transform .5s}
.rrow .chips{margin:0}
.remb{font-size:1.8rem}.rname{font-family:var(--display);font-weight:800;font-size:1.3rem}.rcount{font-family:var(--display);font-weight:800;font-size:1.4rem}
.winner{position:relative;margin-top:14px;padding:18px 22px;border:3px solid var(--wc);border-radius:4px;transition:opacity .6s, transform .6s}
.winner h1{color:var(--wc)}
.wemb{font-size:3rem;line-height:1}
.hide{opacity:0;transform:translateY(10px)}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:10px}
.award{border:2px solid var(--rule);border-radius:4px;padding:16px}
.award h3{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:6px 0 8px}
.award p{margin:0;color:var(--ink-soft)}
.aemb{font-size:2.4rem;line-height:1}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="banner"></div>
<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
